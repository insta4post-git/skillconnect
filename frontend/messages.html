<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages - SkillConnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/ui2-extra.css">
</head>
<body>
  <header class="site"><div class="container">
    <a class="brand" href="/">SkillConnect</a>
    <nav></nav>
  </div></header>
  <main><div class="container">
    <h1>Messages</h1>
    <div class="chat-layout">
      <div class="card" style="padding:0"><div id="inbox"><div class="loading">Loading...</div></div></div>
      <div class="card" id="chat" style="display:none">
        <h2 id="chat-status"></h2>
        <div id="thread"></div>
        <p id="closed-note" class="notice" style="display:none;margin-top:10px">This chat is closed because the request is finished. You can still read the history.</p>
        <form id="send-form" novalidate>
          <div class="send-row"><input id="msg-body" type="text" maxlength="1000" placeholder="Type a message" autocomplete="off"><button class="btn" type="submit">Send</button></div>
          <div id="msg-error" class="form-error"></div>
        </form>
      </div>
    </div>
  </div></main>
  <footer class="site">SkillConnect · college project</footer>
  <script src="/js/app.js"></script>
  <script src="/js/messages.js"></script>
</body>
</html>
