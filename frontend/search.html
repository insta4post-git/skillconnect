<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find providers - SkillConnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/ui2-extra.css">
</head>
<body>
  <header class="site"><div class="container">
    <a class="brand" href="/">SkillConnect</a>
    <nav></nav>
  </div></header>
  <main><div class="container">
    <h1>Find providers</h1>
    <form id="filters" class="card filters" novalidate>
      <div><label for="q">Skill or name</label><input id="q" name="q" type="search" maxlength="100" placeholder="electrician, tutor..."></div>
      <div><label for="category_id">Category</label><select id="category_id" name="category_id"><option value="">All</option></select></div>
      <div><label for="city">City</label><input id="city" name="city" type="text" maxlength="100"></div>
      <div><label for="area">Area</label><input id="area" name="area" type="text" maxlength="100"></div>
      <div><label for="service_type">Service type</label>
        <select id="service_type" name="service_type"><option value="">Any</option><option value="NON_REGULAR">One-time</option><option value="REGULAR">Regular</option></select></div>
      <div><label for="min_rating">Minimum rating</label>
        <select id="min_rating" name="min_rating"><option value="">Any</option><option value="3">3★ and up</option><option value="4">4★ and up</option></select></div>
      <label class="check"><input type="checkbox" name="near_me"> <span id="near-me-label">Near me</span></label>
      <button class="btn" type="submit">Search</button>
    </form>
    <div id="results"></div>
    <div id="pager" class="pager"></div>
  </div></main>
  <footer class="site">SkillConnect · college project</footer>
  <script src="/js/app.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
