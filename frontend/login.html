<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SkillConnect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site"><div class="container">
    <a class="brand" href="/">SkillConnect</a>
    <nav></nav>
  </div></header>
  <main><div class="container">
    <div class="card form-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to your account.</p>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div id="form-error" class="form-error" role="alert"></div>
        <button class="btn" type="submit">Log in</button>
      </form>
      <p class="small muted" style="text-align:center;margin-top:14px">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </div></main>
  <footer class="site">SkillConnect · college project</footer>
  <script src="/js/app.js"></script>

</body>
</html>
